if(t>.35&&t<.5)R(0,0,640,352,'#fff');if(t>1.9){ST='over';ov(`<h2 class="lose">VOCÊ FOI PEGO</h2><p>${a.n} te pegou na Noite ${night}.</p><div class="btns"><button class="btn big" data-a="again">TENTAR DE NOVO</button><button class="btn" data-a="menu">MENU</button></div>`)}}
function hud(){const h=Math.min(5,T/50|0);X.textAlign='left';X.fillStyle='#000a';X.fillRect(6,4,150,22);X.fillStyle='#e8c46a';X.font='bold 13px system-ui';X.fillText('Noite '+night+' · '+(h?h:12)+' AM',12,20);
X.fillStyle='#000a';X.fillRect(484,4,150,22);X.fillStyle=P>25?'#3fae80':'#ef4b5b';X.fillRect(488,8,P*1.0*1.38,14);X.fillStyle='#fff';X.font='bold 11px system-ui';X.fillText('⚡'+(P|0)+'%',494,19);
if(!COARSE){X.fillStyle='#ffffff66';X.font='11px system-ui';X.textAlign='left';X.fillText('←→ olhar · Espaço lanterna · M máscara · C câmeras',10,346)}}
function draw(){X.setTransform(1,0,0,1,0,0);if(ST==='scare'){drawScare();return}
if(ST==='intro'){R(0,0,640,352,'#000');X.fillStyle='#e8c46a';X.textAlign='center';X.font='600 36px Georgia';X.fillText('12:00 AM',320,170);X.font='18px Georgia';X.fillText('Noite '+night,320,205);return}
X.save();if(shk>0)X.translate((rn()-.5)*10,(rn()-.5)*10);if(cams&&ST==='play')camView();else office();X.restore();maskDraw();if(fl>0)R(0,0,640,352,'rgba(255,255,255,.35)');
if(ST==='play'||ST==='pause'){hud()}
const v=X.createRadialGradient(320,176,150,320,176,420);v.addColorStop(0,'#0000');v.addColorStop(1,'#000a');X.fillStyle=v;X.fillRect(0,0,640,352)}
function loop(n){const dt=Math.min(.05,Math.max(0,(n-last)/1000));last=n;tt+=dt;try{if(ST==='play')upd(dt);else if(ST==='intro'){it+=dt;if(it>2.8)ST='play'}else if(ST==='scare')sc.t+=dt;draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
/* ---------- controles ---------- */
const km={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',' ':'f',f:'f',F:'f',m:'m',M:'m',Shift:'m',c:'c',C:'c',ArrowUp:'c',ArrowDown:'c'};
function press(k){if(ST!=='play')return;if(k==='l'&&!cams){view=view==='R'?'F':'L'}else if(k==='r'&&!cams){view=view==='L'?'F':'R'}else if(k==='c'&&!black&&!mask){cams=!cams;beep(cams?600:400,.06)}}
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='p'||e.key==='P'){if(ST==='play')pause();else if(ST==='pause')resume();return}
if(ST==='play'&&cams&&/^[0-9]$/.test(e.key)){cam=e.key==='0'?10:+e.key;e.preventDefault();return}
const k=km[e.key];if(k){if(!keys[k])press(k);keys[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=km[e.key];if(k)keys[k]=0});addEventListener('blur',()=>{keys={};pause()});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();if(!keys[k])press(k);keys[k]=1};['pointerup','pointerleave','pointercancel'].forEach(v=>b['on'+v]=()=>keys[k]=0);b.oncontextmenu=e=>e.preventDefault()});
c.addEventListener('pointerdown',e=>{if(ST!=='play'||!cams)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*640/r.width,y=(e.clientY-r.top)*352/r.height;for(let i=0;i<10;i++){const bx=430+(i%5)*40,by=278+(i/5|0)*32;if(x>=bx&&x<bx+38&&y>=by&&y<by+30){cam=i+1;beep(700,.05)}}});
const foc=()=>{try{$('wrap').focus()}catch(e){}};
function ov(h){const o=$('ov');o.innerHTML=h;o.style.display='flex';o.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{beep(500,.05);act(b.dataset.a)})}
function act(a){if(a==='new'){night=1;startN()}else if(a==='cont'){night=saved;startN()}else if(a==='next'){night++;startN()}else if(a==='again')startN();else if(a==='menu')menu();else if(a==='how')how();else if(a==='resume')resume()}
function menu(){ST='menu';ov(`<h1><small>5 NOITES NO</small>CASSINO VOL.2</h1><p>Sobreviva até as 6 da manhã. Lanterna, máscara e câmeras são tudo que você tem.</p><div class="btns"><button class="btn big" data-a="new">NOVO JOGO</button>${saved>1?`<button class="btn" data-a="cont">CONTINUAR · NOITE ${saved}</button>`:''}<button class="btn" data-a="how">COMO JOGAR</button></div><p style="font-size:.7rem;color:#8d93a1">Jogo gratuito, sem apostas e sem dinheiro real.</p>`)}
function how(){ov(`<h2>COMO JOGAR</h2><div class="how"><p><b>Olhar:</b> ◀ ▶ (ou ← →). São 3 entradas: esquerda, frente e direita.<br><b>🔦 Lanterna (segure):</b> afasta os <b>Withered</b> (Old Remy, Old Rouge, Old Ray, Old Forest) e o <b>Wood</b> — só funciona se estiver olhando para o lado deles.<br><b>🎭 Máscara (segure):</b> engana os <b>Toys</b> (Remy, Rouge, Ray) e o <b>Cupid</b>. O Cupid pode aparecer bem na sua frente: seja rápido!<br><b>📹 Câmeras:</b> 10 salas — toque nos botões numerados (ou teclas 1–0). Cuidado: não dá pra usar lanterna ou máscara com as câmeras abertas.<br><b>⚡ Energia:</b> tudo gasta bateria. Se acabar, escuridão total...<br><b>Pausa:</b> P ou Esc.</p></div><div class="btns"><button class="btn big" data-a="menu">VOLTAR</button></div>`)}
function pause(){if(ST!=='play')return;ST='pause';ov(`<h2>PAUSADO</h2><div class="btns"><button class="btn big" data-a="resume">CONTINUAR</button><button class="btn" data-a="menu">MENU</button></div>`)}
function resume(){ST='play';$('ov').style.display='none';foc()}
function fit(){const w=innerWidth,h=innerHeight,bw=COARSE?150:0,s=Math.min((w-2*bw)/640,h/352),k=$('wrap');k.style.width=Math.floor(640*s)+'px';k.style.height=Math.floor(352*s)+'px';if(h>w&&COARSE)pause()}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));document.addEventListener('contextmenu',e=>e.preventDefault());
resetN();menu();fit();requestAnimationFrame(loop);
</script></body></html>
